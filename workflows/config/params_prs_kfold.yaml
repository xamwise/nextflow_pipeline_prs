# PRS Models Pipeline Parameters (hold-out test set + k-fold cross-validation)
# Usage: nextflow run workflows/holdout_kfold_prs_models_pipeline.nf -params-file workflows/config/params_prs_kfold.yaml

# General Settings
population: brc_sim
base_dir: /Users/max/Desktop/PRS_Models/nextflow_pipeline_prs
sumstats: breast_cancer_sumstats

# Use existing QC data
use_existing_qc: true
qc_data_path: /Users/max/Desktop/PRS_Models/nextflow_pipeline_prs/data/qc/brc_sim.QC
pcs_path: /Users/max/Desktop/PRS_Models/nextflow_pipeline_prs/data/raw/brc_sim/brc_sim.eigenvec
sum_stats_qc_path: /Users/max/Desktop/PRS_Models/nextflow_pipeline_prs/data/supplement_data/sum_stats/breast_cancer_sumstats.QC

# Model Selection
run_lassosum: true
run_prsice: true
run_ldpred2: true 
run_prs_cs: true
run_prs_csx: true
run_sbayesr: true
run_sbayesrc_gctb: false
run_prset: false
run_lassosum2: true
run_sct: true
run_ldpred2_cli: true

# PRSice Parameters
prsice:
  a1: A1
  a2: A2
  stat: OR # BETA or OR
  binary_target: T
  base_maf: "MAF:0.01"
  base_info: "INFO:0.8"

# LDpred2 Parameters
ldpred2:
  trait: bin # bin or quant
  model: auto

# PRS-CS Parameters
prs_cs:
  n_gwas: 228000

# PRS-CSX Parameters
prs_csx:
  n_gwas: 228000
  population: EUR # AFR, AMR, EAS, EUR and SAS are allowed

# SBAYESR Parameters
sbayesr:
  ld_folder: ukbEUR_HM3
  annotation: annot_baseline2.2.txt

# SBayesRC with the GCTB command line tool (second SBayesRC implementation; defaults to the sbayesr settings)
sbayesrc_gctb:
  ld_folder: ukbEUR_HM3
  annotation: annot_baseline2.2.txt

# PRSet Parameters
prset:
  a1: A1
  a2: A2
  stat: BETA
  binary_target: F
  base_maf: "MAF:0.01"
  base_info: "INFO:0.8"
  gtf: "gene.gtf"
  set: "set.txt"

# LASSOSUM2 Parameters
lassosum2:
  sample_size: 228000
  trait: "binary" # binary or quant

sct:
  split: 0.8

# Hold-out test set, split off before the k-fold split
holdout:
  test_size: 0.1
  random_state: 42

# K-fold split of the remaining (development) samples
folds:
  n_folds: 10
  random_state: 42


# Resources
max_memory: 64.GB
max_cpus: 16
max_time: 24.h